name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        working-directory: android
        env:
          SIGNING_STORE_B64: ${{ secrets.SIGNING_STORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$SIGNING_STORE_B64" ]; then
            echo "$SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export SIGNING_STORE_FILE="$RUNNER_TEMP/release.keystore"
          else
            unset SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/annotate_log.py "$RUNNER_TEMP/build.log" "Android build"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "PocketSlicer-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PocketSlicer-apk
          path: PocketSlicer-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: PocketSlicer 0.1.${{ github.run_number }}
          body: |
            Install `PocketSlicer-0.1.${{ github.run_number }}.apk` on your phone. It updates over any earlier build.
          files: PocketSlicer-0.1.${{ github.run_number }}.apk
          make_latest: true
