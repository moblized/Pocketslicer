name: Server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/moblized/pocketslicer-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: server
        run: |
          set -o pipefail
          pip install -q -r requirements-dev.txt
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"
      - name: Report test failures
        if: failure()
        run: python3 .github/scripts/annotate_log.py "$RUNNER_TEMP/pytest.log" "Server tests"

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: pocketslicer-server:test
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Slice test parts with the real OrcaSlicer
        run: docker run --rm pocketslicer-server:test /opt/venv/bin/python -m app.smoke

      - name: OrcaSlicer diagnostics
        if: failure()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/gh_token"
          docker run --rm -v "$PWD/server/docker:/dbg:ro" -v "$RUNNER_TEMP/gh_token:/run/secrets/github_token:ro" \
            pocketslicer-server:test bash /dbg/debug-orca.sh

      - name: API answers inside the container
        run: |
          docker run -d --name api -p 8790:8790 -e API_TOKEN=ci pocketslicer-server:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/api/health; then break; fi
            sleep 2
          done
          echo
          curl -fsS -H "Authorization: Bearer ci" http://127.0.0.1:8790/api/printers | head -c 600
          echo
          docker logs api 2>&1 | tail -20
          docker rm -f api

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/moblized/pocketslicer
            org.opencontainers.image.description=PocketSlicer server: OrcaSlicer slicing API for the PocketSlicer app
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
