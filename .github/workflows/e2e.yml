name: End-to-end (emulator)

on:
  push:
    branches: [main]
    paths: ["android/**", "server/**", "e2e/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PocketSlicer.apk"

      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: pocketslicer-server:e2e
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha

      - name: Start server and seed one slice
        run: |
          docker run -d --name server -p 8790:8790 -e API_TOKEN=e2e pocketslicer-server:e2e
          python3 e2e/seed.py http://127.0.0.1:8790 e2e

      - name: Drive the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 e2e/drive.py PocketSlicer.apk

      - name: Server log
        if: always()
        run: docker logs server 2>&1 | tail -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots/
